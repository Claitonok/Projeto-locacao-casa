<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="ICON" type="ICON" sizes="16x16" href="https://images.icon-icons.com/5/PNG/256/home_243.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="ICON" type="ICON" sizes="16x16" href="https://images.icon-icons.com/5/PNG/256/home_243.png">
  <link rel="stylesheet" href="./css/pagCadastroUsers.css">
  <title>cadastra-se</title>
</head>

<body>

  <header>

    <div id="cabecalho">
      <img width="50" height="50" src="https://images.icon-icons.com/5/PNG/256/home_243.png" alt="casa">
      <h4>Hospedagem ♾️ Home ♾️ Page</h4>

      <a href="http://localhost:8080/Home_acomodacao/Home_acomo_Servlet?acao=home" target="_blank"
        rel="noopener noreferrer"><button class="btn btn-dark">Home</button></a>
    </div>

  </header>


  <div class="logoCasa">
    <img height="100" width="100" src="https://images.icon-icons.com/5/PNG/256/home_243.png" alt="Casa">
  </div>

  <form action="./conferirPagar.html" method="post" class="needs-validation" novalidate>


    <label for="validationCustom01" class="col-sm-2 col-form-label">Nome</label>
    <div class="col-auto">
      <input type="text" id="validationCustom01" class="form-control" required>
       <div class="invalid-feedback">
        Campo nome obrigatorio.
      </div>
    </div>


    <label for="validationCustom02" class="col-sm-2 col-form-label">Email</label>
    <div class="col-auto">
      <input placeholder="exemplo@exemplo.com" type="email" id="validationCustom02" class="form-control" required>
       <div class="invalid-feedback">
        Campo email obrigatorio.
      </div>
    </div>



      <label for="validationCustom03" class="col-sm-2 col-form-label">Password</label>
    <div class="col-auto">
      <input type="password" id="validationCustom03" class="form-control" required>
      <div class="invalid-feedback">
        Campo senha obrigatorio.
      </div>
    </div>

    <div class="col-auto">
      <span id="passwordHelpInline" class="form-text">
        Must be 8-20 characters long.
      </span>
    </div>


    <label for="validationCustom04" class="col-sm-2 col-form-label">Telefone</label>
    <div class="col-auto">
      <input placeholder="(DD)xxxxx-xxxx" type="tel" id="validationCustom04" class="form-control" required>
     <div class="invalid-feedback">
        Campo telefone obrigatorio.
      </div>
    </div>

    <div class="Sign-in">
      <input type="hidden" name="acao" value="login"><br>
      <button type="submit" name="autentica" class="btn btn-dark">Confirmar identidade</button>
    </div>

  </form>

  <script src="pastajs/formScript.js"></script>

</body>

</html>
