<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="ICON" type="ICON" sizes="16x16" href="https://images.icon-icons.com/5/PNG/256/home_243.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="ICON" type="ICON" sizes="16x16" href="https://images.icon-icons.com/5/PNG/256/home_243.png">
    <link rel="stylesheet" href="./css/styDadosUsuario.css">
    <title>Dados do Usuário</title>
</head>

<!-- ESSE ARQUIVO É PARA ATUALIZAR OS DADOS DO USUÁRIO COM O FORMULÁRIO O "ARQUIVO.JSP" -->

<body>

    <header>

        <div id="cabecalho">
            <img width="50" height="50" src="https://images.icon-icons.com/5/PNG/256/home_243.png" alt="casa">
            <h4>Hospedagem ♾️ Home ♾️ Page</h4>

            <a href="http://localhost:8080/Home_acomodacao/Home_acomo_Servlet?acao=area_do_usuario"><button class="btn btn-dark">Área do Usuário</button></a>
        </div>

    </header>

    <div class="container">

        <form action="" method="post" class="needs-validation" novalidate>
    
        <div class="profile-container">
            <img src="./img/user_icon_143482.svg" alt="Foto de Perfil" class="profile-pic" name="caminho_da_foto" id="Foto">
        </div>
    
        <label for="validationCustom01" class="col-sm-2 col-form-label">Nome</label>
        <div class="col-auto">
          <input type="text" id="validationCustom01" class="form-control" required>
           <div class="invalid-feedback">
            Campo nome obrigatorio.
          </div>
        </div>

        <label for="foto" class="col-sm-2 col-form-label">Foto</label>
        <div class="col-auto">
          <input type="file" id="foto" class="form-control">
        </div>
    
        <label for="validationCustom02" class="col-sm-2 col-form-label">Email</label>
        <div class="col-auto">
          <input placeholder="exemplo@exemplo.com" type="email" id="validationCustom02" class="form-control" required>
           <div class="invalid-feedback">
            Campo email obrigatorio.
          </div>
        </div>
    
        <label for="validationCustom03" class="col-sm-2 col-form-label">Password</label>
        <div class="col-auto">
          <input type="password" id="validationCustom03" class="form-control" required>
          <div class="invalid-feedback">
            Campo senha obrigatorio.
          </div>
        </div>
    
        <div class="col-auto">
          <span id="passwordHelpInline" class="form-text">
            Must be 8-20 characters long.
          </span>
        </div>
    
    
        <label for="txtTelefone" class="col-sm-2 col-form-label">Telefone</label>
        <div class="col-auto">
          <input placeholder="(DD)xxxxx-xxxx" type="tel" id="txtTelefone" class="form-control" maxlength="15" required>
         <div class="invalid-feedback">
            Campo telefone obrigatorio.
          </div>
        </div>
    
        <div class="ButtonAtualizarDados">
          <input type="hidden" name="acao" value="AtualizarDados"><br>
          <button type="submit" name="autentica" class="btn btn-dark">Atualizar dados</button>
        </div>
    
      </form>

    </div>

  <script type="text/javascript" src="pastajs/formScript.js"></script>
  <script type="text/javascript" src="pastajs/formataTelefone.js"></script>
  <script type="text/javascript" src="pastajs/formataFoto.js"></script>

</body>

</html>
