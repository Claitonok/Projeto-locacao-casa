<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" sizes="16x16" href="./img/Clock_31089.png">
  <title>Digital Clock – Real-Time Web Clock</title>
  <link rel="stylesheet" href="real_time.css">
</head>
<body class="dark">
 
  <div class="container">
    <div class="date" id="date"></div> 

    <div class="clock">
      <span id="hours">00</span> :
      <span id="minutes">00</span> :
      <span id="seconds">00</span>
      <span id="period"></span>
    </div>
 
    <div class="controls">
      <button id="toggleFormat">Formato 12h</button>
      <button id="toggleTheme">☀️ Light</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
