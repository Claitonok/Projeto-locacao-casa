<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="ICON" type="ICON" sizes="16x16" href="https://images.icon-icons.com/5/PNG/256/home_243.png">
    <link rel="stylesheet" href="qrCodeGenerate.css">
    <title>Generate QR Code</title>
</head>

<body>

    <header>
        <div id="cabecalho">
            <img width="50" height="50" src="https://images.icon-icons.com/5/PNG/256/home_243.png" alt="casa">
            <h4>Generate QR Code ♾️ Home ♾️ Page</h4>
            <a href="http://"><button class="btn btn-light">informações</button></a>
        </div>
    </header>

<main>
    <div class="container text-center">
        <h1>Generate QR Code</h1>
        <p>Enter a URL below to generate its QR code.</p>
    </div>
    <form class="row g-3 needs-validation" novalidate>
        <label for="link" class="col-sm-2 col-form-label">Link</label>
        <div class="row mb-3">
            <div class="col-sm-10">
                <input type="text" class="form-control" id="link" value="https://hogangnono.com" required>
                <div class="invalid-feedback">
                    Enter the URL you want to generate a QR code for.
                </div>
            </div>
        </div>
    </form>
    <div id="qrcode"></div>
</main>

<script type="text/javascript" src="./qrCodeGenerate.js"></script>

<script>
    (() => {
  'use strict'

  // Fetch all the forms we want to apply custom Bootstrap validation styles to
  const forms = document.querySelectorAll('.needs-validation')

  // Loop over them and prevent submission
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }

      form.classList.add('was-validated')
    }, false)
  })
})()
</script>

</body>
</html>
