<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glass Sidebar</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <i class="bx bx-layer"></i>
      <span>GlassUI</span>
    </div>

    <nav>
      <a class="active"><i class="bx bx-home"></i><span>Home</span></a>
      <a><i class="bx bx-user"></i><span>Profile</span></a>
      <a><i class="bx bx-bar-chart"></i><span>Analytics</span></a>
      <a><i class="bx bx-cog"></i><span>Settings</span></a>
    </nav>

    <button class="toggle" onclick="toggleSidebar()">
      <i class="bx bx-menu"></i>
    </button>
  </aside>

<script src="script.js"></script>
</body>
</html>
